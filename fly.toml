# Gnosis — Fly.io deployment config
#
# v1.4.9-equivalent: written after the first dashboard-driven deploy failed
# because Fly's auto-generated fly.toml used the legacy [[services]] format
# (which conflicts with org IP routing) and set a release_command of
# 'npx prisma migrate deploy' (which fails because this repo doesn't use
# Prisma migration files — it uses prisma db push + raw SQL on boot).
#
# Modern [http_service] block: Fly auto-handles HTTPS termination + IPs.
# No release_command: scripts/startup.sh handles table creation on boot
# via prisma/startup-create-tables.sql (idempotent CREATE TABLE IF NOT EXISTS).

app = "gnosis-test"
primary_region = "hkg"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # No release_command — startup.sh handles table creation on container boot
  # via raw SQL (idempotent). Prisma migrations are not used in this repo.

[env]
  NODE_ENV = "production"
  PORT = "3000"

# Modern Fly HTTP service block — replaces legacy [[services]].
# Fly auto-allocates IPv6 (free) and terminates TLS at the edge.
# We allocate IPv4 separately with `flyctl ips allocate-v4` for mobile
# compatibility (some Android carriers don't route IPv6-only hosts well).
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

# Smallest VM — sufficient for a Next.js standalone server + Tesseract OCR
# during testing. Can scale up if extraction memory peaks higher.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
